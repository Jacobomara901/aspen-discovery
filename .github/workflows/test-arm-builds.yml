name: Test ARM Builds
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build_aspen_docker_images:
    name: Test Build Aspen Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract GitHub Tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        id: extract_tag
        run: echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Add placeholder if this is not a tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        id: extract_tag_dummy
        run: echo "GIT_TAG=NOTHING" >> $GITHUB_ENV

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            repo.homeserv.uk/aspen-discovery/aspen:latest
            repo.homeserv.uk/aspen-discovery/aspen:${{ env.GIT_TAG }}
          no-cache: true

